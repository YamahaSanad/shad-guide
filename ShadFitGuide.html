<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>SHAD Fit Guide</title>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: sticky navy top bar (brand, bike, search) over one content column, bottom tab bar.
   Product page stacks: hero, what to add, how to fit. Palette: Yamaha racing blue, navy, signal red, ice grey. */
:root{
  --bg:#EDF1F8; --surface:#FFFFFF; --surface2:#E3EAF6; --ink:#0A1226; --muted:#55617A; --line:#D1DAEA;
  --blue:#0A3CA8; --blue-hi:#1E55CF; --on-blue:#FFFFFF; --accent:#0A3CA8; --navy:#061B4F; --navy2:#0A2A78;
  --red:#D9001B; --ice:#C9D3E0;
  --ok:#14703F; --ok-bg:#E1F4EA; --warn:#8A5200; --warn-bg:#FFF1D6; --bad:#B50F2B; --bad-bg:#FDE4E8; --info:#0A3CA8; --info-bg:#E3EBFB;
  --a-dark:#1B2740; --a-mid:#7E92B3; --a-silver:#C3CEDF; --a-bg:#E3EAF6; --a-chip:#061B4F;
  --shadow:0 1px 2px rgba(6,27,79,.08),0 6px 18px rgba(6,27,79,.07);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050B1A; --surface:#0D1830; --surface2:#15244A; --ink:#EAF0FF; --muted:#9AA9C9; --line:#223562;
  --blue:#3B6FEA; --blue-hi:#5A89FF; --on-blue:#FFFFFF; --accent:#82A6FF; --navy:#04102F; --navy2:#0A2A78; --red:#FF4560; --ice:#2A3B63;
  --ok:#59D69B; --ok-bg:#0F2E22; --warn:#FFC25A; --warn-bg:#352708; --bad:#FF7C90; --bad-bg:#3A1019; --info:#82A6FF; --info-bg:#112254;
  --a-dark:#0A1226; --a-mid:#5C73A0; --a-silver:#9DB0D3; --a-bg:#15244A; --a-chip:#0A2A78;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050B1A; --surface:#0D1830; --surface2:#15244A; --ink:#EAF0FF; --muted:#9AA9C9; --line:#223562;
  --blue:#3B6FEA; --blue-hi:#5A89FF; --on-blue:#FFFFFF; --accent:#82A6FF; --navy:#04102F; --navy2:#0A2A78; --red:#FF4560; --ice:#2A3B63;
  --ok:#59D69B; --ok-bg:#0F2E22; --warn:#FFC25A; --warn-bg:#352708; --bad:#FF7C90; --bad-bg:#3A1019; --info:#82A6FF; --info-bg:#112254;
  --a-dark:#0A1226; --a-mid:#5C73A0; --a-silver:#9DB0D3; --a-bg:#15244A; --a-chip:#0A2A78;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:.01em;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:34px;font-weight:800;text-transform:uppercase}
h2{font-size:24px;font-weight:700;text-transform:uppercase}
h3{font-size:19px;font-weight:700;text-transform:uppercase}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue-hi);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* top bar */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(100deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-bottom:3px solid var(--red)}
.top .wrap{display:grid;gap:10px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);text-transform:uppercase;font-weight:800;font-size:22px;letter-spacing:.04em;cursor:pointer;background:none;border:0;color:#fff;padding:0}
.brand small{font-weight:600;font-size:13px;letter-spacing:.14em;opacity:.8}
.bikepick{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.bikepick label{opacity:.8;font-family:var(--f-display);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.bikepick select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:7px 10px;font-weight:600;max-width:100%;min-width:0}
.bikepick select option{color:#0A1226;background:#fff}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#5B6B8F;pointer-events:none}
.search input{width:100%;border:0;border-radius:12px;padding:14px 14px 14px 44px;font-size:16px;background:#fff;color:#0A1226;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.search input::placeholder{color:#6A7794}
.search input{padding-right:44px}
.sclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:#E3EAF6;color:#0A1226;font-size:22px;line-height:1}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:38px;white-space:nowrap}
.cats button.on{background:#fff;color:#0A2A78;border-color:#fff}
.search input:focus-visible{outline:3px solid #8FB0FF}

/* generic */
main{padding-block:18px 24px;display:grid;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.row{display:flex;gap:12px;align-items:center;min-width:0}
.between{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--surface2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn.pri{background:var(--blue);color:var(--on-blue)}
.btn.pri:hover{background:var(--blue-hi)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:999px;font-weight:600;font-size:14px;min-height:40px}
.chip:hover{border-color:var(--blue)}
.chip.on{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.tag{display:inline-block;font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:2px 8px;border-radius:5px;background:var(--surface2);color:var(--muted)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.info{background:var(--info-bg);color:var(--info)}
.price{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--accent);line-height:1}
.price small{font-size:14px;font-weight:700;letter-spacing:.06em;margin-left:3px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600;letter-spacing:.02em}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-align:left}
.link:hover{text-decoration:underline}

/* hero */
.hero{border-radius:18px;padding:22px 20px;color:#fff;background:linear-gradient(115deg,var(--navy) 0%,var(--blue) 70%,var(--blue-hi) 100%);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-20px;bottom:-20px;width:120px;background:rgba(255,255,255,.08);transform:skewX(-18deg)}
.hero::before{content:"";position:absolute;right:50px;top:-20px;bottom:-20px;width:26px;background:var(--red);transform:skewX(-18deg);opacity:.9}
.hero h1{font-size:38px;max-width:560px;position:relative}
.hero p{max-width:520px;opacity:.9;margin-top:8px;position:relative}
.hero .rule{position:relative;margin-top:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:10px 12px;font-size:14px;max-width:560px}
.hero .rule b{font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase}

/* bike cards */
.bike{display:grid;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
.bike:hover{border-color:var(--blue)}
.bike .nm{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1.05}
.bike .kd{font-size:13px;color:var(--muted)}
.bike.on{outline:3px solid var(--blue);outline-offset:0}

/* result rows */
.part{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-width:0}
.part .art{width:96px}
.part .t{min-width:0}
.part .t .name{font-weight:600;overflow-wrap:anywhere}
.part .r{display:grid;gap:8px;justify-items:end}
.part:hover{border-color:var(--blue)}
.ph{position:relative;height:0;padding-top:70%;background:#fff;border-radius:10px;overflow:hidden}
.ph img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;display:block}
.phchip{position:absolute;left:6px;bottom:6px;background:var(--a-chip);color:#fff;font-family:var(--f-display);font-weight:800;letter-spacing:.06em;font-size:13px;padding:2px 8px;border-radius:5px}
.phead .ph{border:1px solid var(--line)}
.part .phchip{font-size:10px;padding:1px 5px;left:3px;bottom:3px;letter-spacing:.03em}
.art svg{display:block;width:100%;height:auto;border-radius:10px;background:var(--a-bg)}
@media (max-width:520px){.part{grid-template-columns:76px 1fr}.part .art{width:76px}.part .r{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}}

/* product */
.crumb{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.phead{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:20px;align-items:start}
@media (max-width:700px){.phead{grid-template-columns:1fr}}
.phead .art svg{border:1px solid var(--line)}
.pitch{font-size:17px;font-weight:500;margin-top:8px}
.say{margin-top:12px;border-left:4px solid var(--red);background:var(--surface2);padding:10px 12px;border-radius:0 10px 10px 0}
.say b{font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--red);display:block}
.ben{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ben li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.ben svg{width:20px;height:20px;color:var(--ok);margin-top:2px}
.sect{display:grid;gap:12px}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.specs div{background:var(--surface);padding:10px 12px}
.specs dt{font-size:12px;color:var(--muted);font-family:var(--f-display);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.specs dd{margin:0;font-weight:600}
.specs{margin:0}
.grp{display:grid;gap:8px}
.grp-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.req{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.req.hit{border-color:var(--ok);background:var(--ok-bg)}
.req.dim{opacity:.55}
.req .nm{font-weight:600;overflow-wrap:anywhere}
.req .r{display:flex;gap:10px;align-items:center}
details.more{border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.more[open] summary{margin-bottom:8px}
.note{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:12px;border-radius:12px;border:1px solid transparent}
.note svg{width:22px;height:22px}
.note b{display:block}
.note.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.note.info{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.note.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.note.tip{background:var(--surface2);color:var(--ink);border-color:var(--line)}
.note .tx{color:var(--ink)}
.note.hot{box-shadow:0 0 0 3px var(--red)}
.setup{background:linear-gradient(115deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:16px;display:grid;gap:10px}
.setup .big{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1}
.setup .lst{font-size:14px;opacity:.9}
.setup .btn.pri{background:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600}
.tabs button.on{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:800;font-size:20px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--blue);color:var(--on-blue)}
.src{font-size:12.5px;color:var(--muted)}
.sys{display:grid;gap:10px;align-content:start}
.sys svg{width:100%;height:auto;background:var(--a-bg);border-radius:12px}

/* quote */
.qrow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--surface2);width:36px;height:36px;font-size:18px;font-weight:700}
.qty span{min-width:34px;text-align:center;font-weight:700}
.total{display:grid;gap:8px}
.total .line{display:flex;justify-content:space-between;gap:12px}
.total .grand{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;color:var(--accent)}
.field{display:flex;align-items:center;gap:8px}
.field input,.field select,.qadd input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:42px}
.field input{width:90px}
textarea.qt{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.qadd input{width:100%}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:10px;color:var(--muted);font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;position:relative;min-height:52px}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--accent);background:var(--info-bg)}
.badge{position:absolute;top:2px;right:calc(50% - 26px);min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;letter-spacing:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;z-index:40;box-shadow:var(--shadow);max-width:90vw;border:1px solid var(--red)}
.empty{text-align:center;padding:28px 12px;display:grid;gap:10px;justify-items:center}
dl.gl{margin:0;display:grid;gap:10px}
dl.gl dt{font-weight:700}
dl.gl dd{margin:0;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card,.part,.bike,.btn{transition:border-color .15s,background .15s,transform .1s}.btn:active{transform:scale(.98)}}
@media (min-width:760px){h1{font-size:44px}.hero h1{font-size:50px}}
</style>
<style>[hidden]{display:none!important}</style>

function frameType(code){return F3.includes(code)?'3p':F4.includes(code)?'4p':null}

function setupFor(p,bike){
  if(!bike)return {parts:[],missing:[],needBike:true};
  const parts=[p.code],missing=[];let frame=null;
  (p.req||[]).forEach(g=>{
    if(g.k==='incl'||g.k==='opt'||!g.parts)return;
    if(g.onlyBike&&g.onlyBike!==bike)return;
    if(g.k==='cond'){if(g.when==='4p'&&frame==='4p')g.parts.forEach(c=>parts.push(c));return}
    const hit=g.parts.find(c=>fitState(c,bike)==='yes'||(fitState(c,bike)==='any'));
    const unknown=g.parts.every(c=>fitState(c,bike)==='unknown');
    if(unknown){missing.push(g.label+' (check fitment for this bike)');return}
    if(!hit){missing.push('No '+g.label.toLowerCase()+' on your list');return}
    parts.push(hit);if(frameType(hit))frame=frameType(hit);
  });
  return {parts,missing};
}

/* search */
function score(p,toks,ctoks){
  const hay=norm([p.code,p.model,p.name,p.cat,p.tags,p.short,(p.bikes||[]).map(b=>BIKES[b].alias).join(' ')].join(' '));
  const ch=compact(hay);let s=0;
  for(let i=0;i<toks.length;i++){const t=toks[i];
    if(hay.includes(t)||(ctoks[i].length>=2&&ch.includes(ctoks[i]))){s+=1;if(norm(p.code)===t||norm(p.model)===t)s+=20;else if(norm(p.code).startsWith(t)||norm(p.model).startsWith(t))s+=8;else if(norm(p.name).includes(t))s+=3}
    else return 0}
  return s;
}
function search(q){
  const toks=norm(q).split(/\s+/).filter(Boolean);if(!toks.length)return {bikes:[],parts:[]};
  const ctoks=toks.map(compact);
  const bikes=BIKE_IDS.filter(id=>{const h=norm(BIKES[id].name+' '+BIKES[id].alias),ch=compact(h);return toks.every((t,i)=>h.includes(t)||(ctoks[i].length>=2&&ch.includes(ctoks[i])))});
  const map=new Map();
  P.forEach(p=>{const s=score(p,toks,ctoks);if(s>0)map.set(p.code,s)});
  bikes.forEach(id=>{BIKES[id].kits.forEach(c=>map.set(c,(map.get(c)||0)+6));BIKES[id].bags.forEach(b=>map.set(b[0],(map.get(b[0])||0)+3))});
  const parts=[...map.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(e=>BY[e[0]]);
  return {bikes,parts};
}

/* fit check on a quote */
function check(cart,bike){
  const has=a=>cart.some(i=>a.includes(i.code));const out=[];

  if(!cart.length)return out;
  cart.forEach(i=>{const st=fitState(i.code,bike);const p=BY[i.code];
    if(st==='no'){const mine=Object.values(BIKES).filter(b=>p.bikes.includes(b.id)).map(b=>b.short).join(', ');push('bad',`${p.code} is made for the ${mine}, not the ${B.short}.`,[])}});

  const tenTop=has(TOPCASES)&&(bike==='tenere'||has(['Y0TN79ST00']));

  if(has(['D0TR551000'])&&!has(PLATES)&&!tenTop)push('bad','The TR55 does not include a mounting plate. Add one.',['D1BTRPA000']);
  if(has(['D0B3820000'])){
    if(!has(FRAMES)){const f=kitFor(FRAMES);push('bad','The SH38X needs a side case frame for the bike (3P or 4P).'+(B&&!f.length?` There is none for the ${B.short} on your price list.`:(B?'':' Choose the bike to see the right frame.')),f)}
    else if(has(F4)&&!has(['204632R000']))push('bad','The SH38X on a 4P frame needs the 4P adapter.',['204632R000']);
    else if(has(F3)&&has(['204632R000']))push('info','The adapter is not needed on the 3P frame.');
  }
  if(has(TERRA)){
    if(!has(F4)){if(has(F3))push('warn','Terra cases are made for the 4P System. A 3P frame is not recommended.');else{const f=kitFor(F4);push('bad','Terra cases need the 4P frame for the bike.'+(B&&!f.length?` There is none for the ${B.short} on your price list.`:(B?'':' Choose the bike to see the right frame.')),f)}}
    if(bike==='tenere'){
      const l=has(['D0TR47100L']),r=has(['D0TR36100R']);
      if(l&&r)push('ok','Mixed pair: 47 L on the left and 36 L on the right. Correct for the Ténéré exhaust.');

    }else if(!(has(['D0TR47100L'])&&has(['D0TR36100R'])))push('info','Terra side cases are usually sold as a left and right pair.',[has(['D0TR47100L'])?'D0TR36100R':'D0TR47100L']);
  }
  if(has(['X0TR300000'])&&!has(FRAMES)){const f=kitFor(FRAMES);push('bad','The TR30 bags need a side case frame for the bike (3P or 4P).'+(B&&!f.length?` There is none for the ${B.short} on your price list.`:(B?'':' Choose the bike to see the right frame.')),f)}

  if(has(F3)&&has(F4))push('warn','The quote has both a 3P and a 4P frame. A bike takes one.');

  if(!bike&&cart.some(i=>fitState(i.code,bike)==='pick'))push('info','Choose the customer\'s bike to check that the kits match.');
  if(!out.some(o=>o.l==='bad'||o.l==='warn'))out.unshift({l:'ok',t:'Everything the bags need is in the quote.',fix:[]});
  return out;
}

function quoteText(cart,bike,disc){
  const sub=cart.reduce((s,i)=>s+BY[i.code].price*i.qty,0);const d=sub*(disc||0)/100;
  const L=['SHAD quote'+(bike?' for '+BIKES[bike].name:''),''];
  cart.forEach(i=>{const p=BY[i.code];L.push(`${i.qty} x ${p.code}  ${p.name}  ${fmt(p.price*i.qty)} JOD`)});
  L.push('');L.push('Subtotal: '+fmt(sub)+' JOD');if(disc)L.push(`Discount ${disc}%: -${fmt(d)} JOD`);L.push('Total: '+fmt(sub-d)+' JOD');L.push('','Suggested unit prices in JOD.');
  return L.join('\n');
}
return {BIKES,BIKE_IDS,P,BY,BYID,PK,F3,F4,FRAMES,TERRA,TOPKITS,RINGS,TANKS,PLATES,norm,esc,fmt,fitState,setupFor,total,search,check,quoteText};

const note=(l,h,t,hot)=>`<div class="note ${l}${hot?' hot':''}">${ic(NOTEIC[l]||'info')}<div class="tx"><b>${esc(h)}</b>${esc(t||'')}</div></div>`;
function fitTag(code){const st=fitState(code,S.bike);return st==='yes'?'<span class="tag ok">Fits your bike</span>':st==='no'?'<span class="tag bad">Other bike</span>':st==='unknown'?'<span class="tag warn">Bike not confirmed</span>':st==='pick'?'<span class="tag info">Bike-specific</span>':''}
const cartCount=()=>S.cart.reduce((s,i)=>s+i.qty,0);
function partRow(p){return `<div class="part"><div class="art" data-act="go" data-v="product-${p.id}">${art(p)}</div><div class="t"><button class="link name" style="font-weight:600" data-act="go" data-v="product-${p.id}">${esc(p.name)}</button><div class="muted" style="font-size:13px"><span class="code">${esc(p.code)}</span> · ${esc(p.cat)}</div><div style="margin-top:4px">${fitTag(p.code)}</div><div class="muted" style="font-size:13px;margin-top:4px">${esc(p.short)}</div></div><div class="r"><div class="price num">${fmt(p.price)}<small>JOD</small></div><button class="btn pri sm" data-act="add" data-v="${p.code}">${ic('plus')} Add</button></div></div>`}
function bikeCard(b){return `<button class="bike${S.bike===b.id?' on':''}" data-act="go" data-v="bike-${b.id}"><span class="kd">${esc(b.kind)}</span><span class="nm">${esc(b.short)}</span><span class="kd">${esc(b.name)}</span></button>`}
const chip=(act,v,label,on)=>`<button class="chip${on?' on':''}" data-act="${act}" data-v="${esc(v)}">${esc(label)}</button>`;

function addCart(code,q){const i=S.cart.find(x=>x.code===code);if(i)i.qty+=(q||1);else S.cart.push({code,qty:q||1});save();drawTabs()}

function renderFind(){

function pkCard(k){return `<div class="card sect"><div><h3>${esc(k.name)}</h3><p class="muted">${esc(k.pitch)}</p></div><div class="muted" style="font-size:13px">${k.parts.map(c=>`<div><span class="code">${esc(c)}</span> ${esc(BY[c].name)}</div>`).join('')}</div>${k.note?`<span class="tag warn">${esc(k.note)}</span>`:''}<div class="row between"><div class="price num">${fmt(k.total)}<small>JOD</small></div><button class="btn pri sm" data-act="addpk" data-v="${k.id}">${ic('plus')} Add setup</button></div></div>`}

function reqGroup(g){
 if(g.onlyBike&&S.bike&&S.bike!==g.onlyBike)return '';
 const kd={incl:['In the box','ok'],must:['Required','bad'],choose:['Choose the one for the bike','info'],cond:['Only with a 4P frame','warn'],opt:['Optional','']}[g.k];
 let h=`<div class="grp"><div class="grp-h"><h3>${esc(g.label)}</h3><span class="tag ${kd[1]}">${kd[0]}</span></div>`;
 if(g.text)h+=`<p class="muted">${esc(g.text)}</p>`;
 if(g.parts){
  const rows=g.parts.map(c=>({c,st:fitState(c,S.bike)}));
  let main=rows,rest=[];
  if(S.bike){main=rows.filter(r=>r.st!=='no');rest=rows.filter(r=>r.st==='no')}
  else if(rows.some(r=>r.st==='pick'))h+=`<p class="muted">Choose the customer's bike at the top to see the right one.</p>`;
  const row=r=>{const p=BY[r.c];return `<div class="req${r.st==='yes'?' hit':''}"><div><button class="link nm" data-act="go" data-v="product-${p.id}">${esc(p.name)}</button><div class="muted" style="font-size:13px"><span class="code">${esc(p.code)}</span> ${fitTag(p.code)}${g.rec&&p.code==='D1BTRPA000'?' <span class="tag ok">Recommended</span>':''}</div></div><div class="r"><b class="num">${fmt(p.price)} JOD</b><button class="btn pri sm" data-act="add" data-v="${p.code}">${ic('plus')} Add</button></div></div>`};
  if(S.bike&&!main.length)h+=note('bad','Nothing on your price list for the '+BIKES[S.bike].short,'This part is bike-specific and no match is listed for this bike.');
  h+=main.map(row).join('');
  if(rest.length)h+=`<details class="more"><summary>Options for other bikes (${rest.length})</summary><div class="grp">${rest.map(row).join('')}</div></details>`;
 }
 return h+'</div>';
}

function renderProduct(p){

 let h=`<div class="crumb"><button class="link" data-act="back">← Back</button><span>/</span><span>${esc(p.cat)}</span></div>`;
 h+=`<section class="phead"><div class="art">${art(p)}</div><div><span class="eyebrow">${esc(p.cat)}</span><h1>${esc(p.name)}</h1><div class="row wrapx" style="margin-top:10px"><div class="price num">${fmt(p.price)}<small>JOD</small></div><span class="code">${esc(p.code)}</span><button class="btn sm ghost" data-act="copycode" data-v="${p.code}">${ic('copy')} Copy code</button></div><p class="pitch">${esc(p.pitch)}</p>${p.say?`<div class="say"><b>Say to the customer</b>${esc(p.say)}</div>`:''}<div class="row wrapx" style="margin-top:12px"><button class="btn pri" data-act="add" data-v="${p.code}">${ic('plus')} Add to quote</button></div></div></section>`;

 }

 if(p.specs&&p.specs.length)h+=`<section class="sect"><h2>Key facts</h2><dl class="specs">${p.specs.map(s=>`<div><dt>${esc(s[0])}</dt><dd>${esc(s[1])}</dd></div>`).join('')}</dl></section>`;
 if(p.req&&p.req.length)h+=`<section class="sect"><h2>What must go with it</h2>${p.req.map(reqGroup).join('')}</section>`;
 const bagCat=['Top cases','Side cases','Soft bags','Tank bags'].includes(p.cat);

   h+=`<section class="setup"><span class="eyebrow" style="color:#fff;opacity:.8">Complete setup for the ${esc(B.short)}</span><div class="big num">${fmt(total(parts))} JOD</div><div class="lst">${parts.map(c=>esc(BY[c].model)).join(' + ')}</div>${su.missing.map(m=>`<div class="lst">⚠ ${esc(m)}</div>`).join('')}<div><button class="btn pri" data-act="addset" data-v="${parts.join(',')}">${ic('plus')} Add whole setup to quote</button></div></section>`;

function stepsBlock(p){
 const st=p.steps;if(!st)return note('tip','Fitting is shown in the leaflet in the box','This part has no separate fitting steps. It goes together with the bag it belongs to.');
 const names={fit:'Fit',remove:'Remove',expand:'Expand',lock:'Lock & keys'};
 const keys=['fit','remove','expand','lock'].filter(k=>st[k]&&st[k].length);
 const cur=keys.includes(S.ptab)?S.ptab:keys[0];
 return `<div class="tabs" role="tablist">${keys.map(k=>`<button role="tab" aria-selected="${k===cur}" class="${k===cur?'on':''}" data-act="ptab" data-v="${k}">${names[k]}</button>`).join('')}</div><ol class="steps">${st[cur].map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol>${st.src?`<p class="src">${esc(st.src)}</p>`:''}`;
}

}
function renderLearn(){
 const sys=[['top','Top Master','For top cases. A plate on the rack, plus a kit that is specific to the bike. The case slides on and clicks.'],['3p','3P System','Slim single-arm frame with three mounting points. Takes SH38X directly and TR30 soft bags. Not recommended for Terra cases.'],['4p','4P System','Four-point steel frame. Strongest. Holds Terra cases, TR30 soft bags, and SH38X with the adapter.'],['click','Click System','Tank bags. A bike-specific ring stays on the tank. The bag clicks on and off in seconds.']];
 let h=`<section class="sect"><h1>Learn the basics</h1><p class="muted">Five minutes and you can advise any customer.</p></section>`;
 h+=`<section class="hero"><h1>Bag + kit</h1><p>Every bag has two halves: the bag, and the bike-specific part that carries it. No kit, no sale.</p></section>`;
 h+=`<section class="sect"><h2>The four systems</h2><div class="grid g2">${sys.map(s=>`<div class="card sys">${sysSvg(s[0])}<h3>${s[1]}</h3><p>${esc(s[2])}</p></div>`).join('')}</div></section>`;
 h+=`<section class="sect"><h2>Four questions, in order</h2><div class="card"><ol class="steps"><li><span><b>Which bike and what year?</b> This decides every kit.</span></li><li><span><b>Solo or two-up?</b> Two-up means bigger cases and a backrest.</span></li><li><span><b>How do you ride?</b> Daily, weekends, or long tours.</span></li><li><span><b>How many helmets or how much luggage?</b> This picks the size.</span></li></ol></div></section>`;
 h+=`<section class="sect"><h2>Words you will hear</h2><div class="card"><dl class="gl"><div><dt>Kit or frame</dt><dd>The bike-specific metal part. The bag is fixed to it.</dd></div><div><dt>Plate</dt><dd>The piece between a top case and its kit. Some cases include it, the TR55 does not.</dd></div><div><dt>Adapter</dt><dd>Lets the SH38X sit on a 4P frame.</dd></div><div><dt>Expandable</dt><dd>The case grows. SH59X from 46 to 58 L, SH38X by 70 mm each side.</dd></div></dl></div></section>`;
 h+=`<section class="sect"><h2>Still to confirm</h2><div class="card"><ul class="ben">${['SH38X litres: sources disagree. Check the leaflet.','TMAX kit Y0TX52ST00: matched by code pattern. Confirm on shad.es.','Click rings: which bike each fits is not on the price list.','TR47L description on the price list says SH3…; part number is the Terra TR47L.','Tracer 9 frame is for the 2021-22 GT. The 2025 model uses a different code.',].map(t=>`<li>${ic('info')}<span>${esc(t)}</span></li>`).join('')}</ul></div></section>`;
 return h;
}

function lineTotals(){const sub=S.cart.reduce((s,i)=>s+BY[i.code].price*i.qty,0);const d=sub*S.disc/100;return {sub,d,grand:sub-d}}
function renderQuote(){
 let h=`<section class="sect"><h1>Quote</h1><p class="muted">A calculator only. Nothing is ordered or sent.</p></section>`;
 h+=`<div class="field wrapx"><label for="qbike" class="eyebrow">Customer's bike</label><select id="qbike" data-bikesel>${bikeOpts()}</select></div>`;
 if(!S.cart.length){
  const ks=PK.filter(k=>!S.bike||k.bike===S.bike).slice(0,4);
  return h+`<div class="card empty"><h3>Your quote is empty</h3><p class="muted">Add parts from any page, or start from a ready setup.</p><button class="btn pri" data-act="go" data-v="find">Find a part</button></div><section class="sect"><h2>Start from a setup</h2><div class="grid g2">${ks.map(pkCard).join('')}</div></section>`;
 }
 const iss=check(S.cart,S.bike);
 h+=`<section class="sect"><h2>Fit check</h2>${iss.map(i=>`<div class="note ${i.l}">${ic(NOTEIC[i.l]||'info')}<div class="tx">${esc(i.t)}${i.fix&&i.fix.length?`<div class="row wrapx" style="margin-top:8px">${i.fix.map(c=>`<button class="btn sm pri" data-act="add" data-v="${c}">${ic('plus')} ${esc(BY[c].model)} · ${fmt(BY[c].price)}</button>`).join('')}</div>`:''}</div></div>`).join('')}</section>`;
 h+=`<section class="card"><h2>Items</h2>${S.cart.map(i=>{const p=BY[i.code];return `<div class="qrow"><div><button class="link" style="font-weight:600" data-act="go" data-v="product-${p.id}">${esc(p.name)}</button><div class="muted" style="font-size:13px"><span class="code">${esc(p.code)}</span> · ${fmt(p.price)} JOD each</div></div><div class="num" style="font-weight:700">${fmt(p.price*i.qty)} JOD</div><div class="row" style="grid-column:1/-1;justify-content:space-between"><div class="qty"><button data-act="dec" data-v="${p.code}" aria-label="Less">−</button><span>${i.qty}</span><button data-act="inc" data-v="${p.code}" aria-label="More">+</button></div><button class="btn sm ghost" data-act="rm" data-v="${p.code}">Remove</button></div></div>`}).join('')}</section>`;
 h+=`<section class="card sect"><h3>Add another part</h3><div class="qadd"><input id="qq" type="search" autocomplete="off" placeholder="Name, model or part number" aria-label="Add another part"></div><div id="qres" class="grid"></div></section>`;
 const t=lineTotals();
 h+=`<section class="card total"><div class="line"><span>Subtotal</span><b class="num" id="sub">${fmt(t.sub)} JOD</b></div><div class="line"><label class="field" for="disc">Discount %<input id="disc" type="number" inputmode="decimal" min="0" max="100" step="0.5" value="${S.disc||''}" placeholder="0"></label><b class="num" id="dline">${S.disc?'−'+fmt(t.d)+' JOD':''}</b></div><div class="line" style="align-items:flex-end"><span class="eyebrow">Total</span><div class="grand num" id="grand">${fmt(t.grand)} <small style="font-size:18px">JOD</small></div></div></section>`;
 h+=`<div class="row wrapx"><button class="btn pri" data-act="copy">${ic('copy')} Copy quote text</button><button class="btn ghost" data-act="clear">${S.confirmClear?'Tap again to clear':'Clear quote'}</button></div>`;
 h+=`<details class="more" id="qtd"><summary>Show quote text</summary><textarea class="qt" id="qt" readonly aria-label="Quote text">${esc(quoteText(S.cart,S.bike,S.disc))}</textarea></details>`;
 return h;
}
function updateTotals(){const t=lineTotals();const a=$('#sub'),b=$('#dline'),c=$('#grand'),d=$('#qt');if(a)a.textContent=fmt(t.sub)+' JOD';if(b)b.textContent=S.disc?'−'+fmt(t.d)+' JOD':'';if(c)c.innerHTML=fmt(t.grand)+' <small style="font-size:18px">JOD</small>';if(d)d.value=quoteText(S.cart,S.bike,S.disc)}

/* ---------- shell ---------- */
function bikeOpts(){return `<option value="">Any bike</option>`+BIKE_IDS.map(id=>`<option value="${id}"${S.bike===id?' selected':''}>${esc(BIKES[id].name)}</option>`).join('')}
function syncBike(){document.querySelectorAll('[data-bikesel]').forEach(s=>{s.innerHTML=bikeOpts()})}
const TABS=[['find','Find','search'],['advisor','Advisor','bulb'],['learn','Learn','book'],['quote','Quote','calc']];
function drawTabs(){const n=cartCount();$('#tabs').innerHTML=TABS.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-act="${t[0]==='find'?'home':'go'}" data-v="${t[0]}" ${S.tab===t[0]?'aria-current="page"':''}>${ic(t[2])}<span>${t[1]}</span>${t[0]==='quote'&&n?`<span class="badge">${n}</span>`:''}</button>`).join('')}
function render(){
 const h=S.cur;let m,out;
 if(m=h.match(/^product-(.+)$/)){const p=BYID[m[1]];S.tab='find';out=p?renderProduct(p):renderFind()}
 else if(m=h.match(/^bike-(.+)$/)){S.tab='find';out=BIKES[m[1]]?renderBike(m[1]):renderFind()}
 else if(h==='advisor'){S.tab='advisor';out=renderAdvisor()}
 else if(h==='learn'){S.tab='learn';out=renderLearn()}
 else if(h==='quote'){S.tab='quote';out=renderQuote()}
 else{S.tab='find';out=renderFind()}
 view.innerHTML=out;drawTabs();drawCats();
 const q=$('#qq');if(q)q.addEventListener('input',()=>{const r=search(q.value).parts.slice(0,5);$('#qres').innerHTML=q.value.trim()?r.map(partRow).join('')||'<p class="muted">Nothing found.</p>':''});
}
const HIST=[];
function route(){const nx=location.hash.slice(1)||'find';if(nx!==S.cur){S.ptab=null;S.confirmClear=false}S.cur=nx;if(HIST[HIST.length-1]!==nx){HIST.push(nx);if(HIST.length>60)HIST.shift()}render();window.scrollTo(0,0)}
function setQ(v){S.q=v;const q=$('#q');if(q&&q.value!==v)q.value=v;const c=$('#sclear');if(c)c.hidden=!v}
function drawCats(){const cats=[...new Set(P.map(p=>p.cat))];const onFind=S.tab==='find'&&S.cur==='find'&&!S.q.trim();$('#cats').innerHTML=`<button data-act="home" class="${onFind&&!S.cat?'on':''}">Home</button>`+cats.map(c=>`<button data-act="cat" data-v="${esc(c)}" class="${onFind&&S.cat===c?'on':''}">${esc(c)}</button>`).join('')}
function go(v){if((location.hash.slice(1)||'find')===v)route();else location.hash=v}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const a=t.dataset.act,v=t.dataset.v;
 switch(a){
  case 'go':go(v);break;
  case 'q':setQ(v);S.cat='';go('find');break;
  case 'cat':setQ('');S.cat=v;go('find');break;
  case 'home':setQ('');S.cat='';go('find');break;
  case 'clearq':setQ('');S.cat='';$('#q').focus();if(S.cur==='find')render();break;
  case 'back':{HIST.pop();const prev=HIST.pop()||'find';go(prev);break}
  case 'add':addCart(v);toast('Added '+BY[v].model);if(S.cur==='quote')render();break;
  case 'addset':addSet(v.split(','));toast('Setup added to quote');break;
  case 'addpk':{const k=PK.find(x=>x.id===v);addSet(k.parts,k.bike);toast('Setup added to quote');break}
  case 'inc':case 'dec':{const i=S.cart.find(x=>x.code===v);if(i){i.qty+=a==='inc'?1:-1;if(i.qty<1)S.cart=S.cart.filter(x=>x!==i)}save();render();break}
  case 'rm':S.cart=S.cart.filter(x=>x.code!==v);save();render();break;
  case 'setbike':S.bike=v;save();syncBike();render();break;
  case 'need':S.need=v;render();break;
  case 'ptab':S.ptab=v;render();break;
  case 'copycode':copyText(v,'Code copied');break;
  case 'copy':copyText(quoteText(S.cart,S.bike,S.disc),'Quote copied');break;
  case 'clear':if(S.confirmClear){S.cart=[];S.disc=0;S.confirmClear=false;save();render()}else{S.confirmClear=true;render();setTimeout(()=>{if(S.confirmClear){S.confirmClear=false;if(S.cur==='quote')render()}},3000)}break;
 }
});
function copyText(txt,msg){
 const fb=()=>{const d=$('#qtd');if(d){d.open=true;const ta=$('#qt');ta.focus();ta.select()}toast('Select the text and copy it')};
 try{navigator.clipboard.writeText(txt).then(()=>toast(msg),fb)}catch(e){fb()}
}
document.addEventListener('change',e=>{if(e.target.matches('[data-bikesel]')){S.bike=e.target.value;save();syncBike();render()}});
document.addEventListener('input',e=>{if(e.target.id==='disc'){S.disc=Math.min(100,Math.max(0,parseFloat(e.target.value)||0));save();updateTotals()}});
$('#bikesel').setAttribute('data-bikesel','');
$('#bikesel').innerHTML=bikeOpts();
$('#q').addEventListener('input',e=>{setQ(e.target.value);S.cat='';if((location.hash.slice(1)||'find')!=='find'){location.hash='find'}else{S.cur='find';render()}});
window.addEventListener('hashchange',route);
S.cur=location.hash.slice(1)||'find';render();
})();
window.addEventListener('error',function(e){var v=document.getElementById('view');if(v&&/Loading the guide/.test(v.textContent||''))v.innerHTML='<div class="card"><h3>The guide could not start</h3><p>'+String(e.message||'Unknown error').replace(/[<>&]/g,'')+'</p><p class="muted">Please send this message to your manager.</p></div>'});
</script>

</body>
</html>
